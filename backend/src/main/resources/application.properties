spring.application.name=bug-tracking-system
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bugtracker?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.jwt.secret=${JWT_SECRET:}
app.environment=${APP_ENV:development}
app.jwt.expiration-ms=86400000
app.upload-dir=${APP_UPLOAD_DIR:uploads}
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
spring.jackson.serialization.write-dates-as-timestamps=false

# Optional email notifications
app.email.enabled=${EMAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
app.security.max-login-attempts=${MAX_LOGIN_ATTEMPTS:10}
app.security.login-window-seconds=${LOGIN_WINDOW_SECONDS:60}
app.security.max-tracked-login-identities=${MAX_TRACKED_LOGIN_IDENTITIES:10000}
